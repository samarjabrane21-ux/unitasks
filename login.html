<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniTasks — Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#f3f0ff,#fff0f6);min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .card{background:white;border-radius:28px;padding:3rem 2.5rem;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(108,99,255,0.15);border:1.5px solid #e0d7ff;}
    .logo{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;color:#6c63ff;margin-bottom:0.2rem;}
    .subtitle{color:#9ca3af;font-size:0.92rem;margin-bottom:2rem;}
    label{display:block;font-size:0.85rem;font-weight:600;color:#374151;margin-bottom:0.4rem;margin-top:1.2rem;}
    input{width:100%;padding:0.85rem 1rem;border:1.5px solid #e5e7eb;border-radius:12px;font-size:1rem;font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.2s;background:#fafafa;}
    input:focus{border-color:#6c63ff;background:white;}
    .btn{width:100%;margin-top:1.8rem;padding:0.95rem;background:#6c63ff;color:white;border:none;border-radius:14px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;box-shadow:0 6px 20px rgba(108,99,255,0.3);}
    .btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(108,99,255,0.4);}
    .err{color:#dc2626;font-size:0.85rem;margin-top:1rem;display:none;background:#fee2e2;padding:0.7rem 1rem;border-radius:10px;}
    .link{text-align:center;margin-top:1.5rem;font-size:0.9rem;color:#6b7280;}
    .link a{color:#6c63ff;text-decoration:none;font-weight:600;}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🎓 UniTasks</div>
    <div class="subtitle">Connecte-toi à ton espace étudiant</div>
    <label>Email</label>
    <input type="email" id="email" placeholder="ton@email.com" onkeydown="if(event.key==='Enter') doLogin()">
    <label>Mot de passe</label>
    <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter') doLogin()">
    <div class="err" id="errMsg"></div>
    <button class="btn" onclick="doLogin()">🔑 Se connecter</button>
    <div class="link">Pas encore de compte ? <a href="register.html">S'inscrire</a></div>
  </div>

  <script src="api.js"></script>
  <script>
    if (AuthAPI.isLoggedIn()) window.location.href = 'index.html';

    async function doLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const err      = document.getElementById('errMsg');

      if (!email || !password) {
        err.textContent = 'Remplis tous les champs.';
        err.style.display = 'block'; return;
      }

      const res = await AuthAPI.login(email, password);

      if (res.success) {
        // Récupérer le profil sauvegardé (si l'utilisateur s'est inscrit sur ce PC)
        const savedProfile = localStorage.getItem('unitasks_profile_' + res.user.username);
        if (savedProfile) {
          // Fusionner avec les données du serveur
          const profile = { ...JSON.parse(savedProfile), ...res.user };
          localStorage.setItem('unitasks_user', JSON.stringify(profile));
        } else {
          localStorage.setItem('unitasks_user', JSON.stringify(res.user));
        }
        window.location.href = 'index.html';
      } else {
        err.textContent = res.error || 'Email ou mot de passe incorrect.';
        err.style.display = 'block';
      }
    }
  </script>
</body>
</html>
