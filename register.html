<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniTasks — Inscription</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#f3f0ff,#fff0f6);min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .card{background:white;border-radius:28px;padding:3rem 2.5rem;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(108,99,255,0.15);border:1.5px solid #e0d7ff;}
    .logo{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;color:#6c63ff;margin-bottom:0.2rem;}
    .subtitle{color:#9ca3af;font-size:0.92rem;margin-bottom:1.8rem;}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
    label{display:block;font-size:0.85rem;font-weight:600;color:#374151;margin-bottom:0.4rem;margin-top:1rem;}
    input,select,textarea{width:100%;padding:0.82rem 1rem;border:1.5px solid #e5e7eb;border-radius:12px;font-size:0.95rem;font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.2s;background:#fafafa;}
    input:focus,select:focus,textarea:focus{border-color:#6c63ff;background:white;}
    textarea{resize:none;height:80px;}
    .avatar-row{display:flex;gap:0.6rem;flex-wrap:wrap;margin-top:0.5rem;}
    .avatar-opt{font-size:1.6rem;cursor:pointer;padding:0.4rem;border-radius:10px;border:2px solid transparent;transition:all 0.2s;}
    .avatar-opt:hover,.avatar-opt.selected{border-color:#6c63ff;background:#f0eeff;}
    .btn{width:100%;margin-top:1.8rem;padding:0.95rem;background:#6c63ff;color:white;border:none;border-radius:14px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;box-shadow:0 6px 20px rgba(108,99,255,0.3);}
    .btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(108,99,255,0.4);}
    .msg{font-size:0.85rem;margin-top:1rem;display:none;padding:0.7rem 1rem;border-radius:10px;}
    .err{color:#dc2626;background:#fee2e2;} .ok{color:#16a34a;background:#dcfce7;}
    .link{text-align:center;margin-top:1.4rem;font-size:0.9rem;color:#6b7280;}
    .link a{color:#6c63ff;text-decoration:none;font-weight:600;}
    .divider{border:none;border-top:1px solid #e5e7eb;margin:1.4rem 0;}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🎓 UniTasks</div>
    <div class="subtitle">Crée ton espace étudiant personnalisé</div>

    <!-- Avatar -->
    <label>Choisis ton avatar</label>
    <div class="avatar-row" id="avatarRow">
      <span class="avatar-opt selected" data-val="🎓">🎓</span>
      <span class="avatar-opt" data-val="👨‍💻">👨‍💻</span>
      <span class="avatar-opt" data-val="👩‍💻">👩‍💻</span>
      <span class="avatar-opt" data-val="🧑‍🎓">🧑‍🎓</span>
      <span class="avatar-opt" data-val="👨‍🔬">👨‍🔬</span>
      <span class="avatar-opt" data-val="👩‍🔬">👩‍🔬</span>
      <span class="avatar-opt" data-val="🦸">🦸</span>
      <span class="avatar-opt" data-val="🧑‍💼">🧑‍💼</span>
    </div>

    <hr class="divider">

    <!-- Nom + Prénom -->
    <div class="form-row">
      <div>
        <label>Prénom</label>
        <input type="text" id="firstname" placeholder="Ton prénom">
      </div>
      <div>
        <label>Nom</label>
        <input type="text" id="lastname" placeholder="Ton nom">
      </div>
    </div>

    <!-- Rôle -->
    <label>Rôle sur la plateforme</label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:0.4rem;margin-bottom:0.8rem;">
      <div id="roleEtudiant" class="avatar-opt selected" style="font-size:1rem;padding:0.7rem;text-align:center;border-radius:12px;border:2px solid #6c63ff;background:#f0eeff;cursor:pointer;font-weight:600;" onclick="selectRole('etudiant')">🎓 Étudiant</div>
      <div id="roleEnseignant" class="avatar-opt" style="font-size:1rem;padding:0.7rem;text-align:center;border-radius:12px;border:2px solid transparent;cursor:pointer;font-weight:600;" onclick="selectRole('enseignant')">👨‍🏫 Enseignant</div>
    </div>

    <!-- Username -->
    <label>Nom d'utilisateur</label>
    <input type="text" id="username" placeholder="ex: aziz_21">

    <!-- Email -->
    <label>Email</label>
    <input type="email" id="email" placeholder="ton@email.com">

    <!-- Spécialité + Groupe -->
    <div class="form-row">
      <div>
        <label id="specialite-label">Spécialité</label>
        <input type="text" id="specialite" placeholder="ex: Cybersécurité">
      </div>
      <div>
        <label id="groupe-label">Groupe</label>
        <input type="text" id="groupe" placeholder="ex: Groupe 3D">
      </div>
    </div>

    <!-- Bio -->
    <label>Bio courte <span style="color:#9ca3af;font-weight:400;">(optionnel)</span></label>
    <textarea id="bio" placeholder="Quelques mots sur toi..."></textarea>

    <!-- Matières -->
    <label id="matieres-label">Tes matières <span style="color:#9ca3af;font-weight:400;">(séparées par des virgules)</span></label>
    <input type="text" id="matieres" placeholder="ex: Maths, Physique, Info, Réseaux">
    <div style="font-size:0.78rem;color:#9ca3af;margin-top:0.3rem;">💡 Tu pourras les modifier dans ton profil</div>

    <!-- Password -->
    <label>Mot de passe</label>
    <input type="password" id="password" placeholder="••••••••">

    <div class="msg" id="msg"></div>
    <button class="btn" onclick="doRegister()">🚀 Créer mon compte</button>
    <div class="link">Déjà un compte ? <a href="login.html">Se connecter</a></div>
  </div>

  <script src="api.js"></script>
  <script>
    let selectedAvatar = '🎓';
    let selectedRole = 'etudiant';

    document.querySelectorAll('.avatar-opt').forEach(opt => {
      if(opt.id !== 'roleEtudiant' && opt.id !== 'roleEnseignant') {
        opt.addEventListener('click', () => {
          document.querySelectorAll('.avatar-opt').forEach(o => {
            if(o.id !== 'roleEtudiant' && o.id !== 'roleEnseignant') o.classList.remove('selected');
          });
          opt.classList.add('selected');
          selectedAvatar = opt.dataset.val;
        });
      }
    });

    function selectRole(role) {
      selectedRole = role;
      const elEtud = document.getElementById('roleEtudiant');
      const elEnsg = document.getElementById('roleEnseignant');
      if (role === 'etudiant') {
        elEtud.classList.add('selected'); elEtud.style.borderColor = '#6c63ff'; elEtud.style.background = '#f0eeff';
        elEnsg.classList.remove('selected'); elEnsg.style.borderColor = 'transparent'; elEnsg.style.background = 'transparent';
        document.getElementById('specialite-label').textContent = 'Spécialité';
        document.getElementById('groupe-label').textContent = 'Groupe';
        document.getElementById('matieres-label').innerHTML = 'Tes matières <span style="color:#9ca3af;font-weight:400;">(séparées par des virgules)</span>';
      } else {
        elEnsg.classList.add('selected'); elEnsg.style.borderColor = '#6c63ff'; elEnsg.style.background = '#f0eeff';
        elEtud.classList.remove('selected'); elEtud.style.borderColor = 'transparent'; elEtud.style.background = 'transparent';
        document.getElementById('specialite-label').textContent = 'Département';
        document.getElementById('groupe-label').textContent = 'Grade / Titre';
        document.getElementById('matieres-label').innerHTML = 'Matières enseignées <span style="color:#9ca3af;font-weight:400;">(séparées par des virgules)</span>';
      }
    }

    async function doRegister() {
      const firstname  = document.getElementById('firstname').value.trim();
      const lastname   = document.getElementById('lastname').value.trim();
      const username   = document.getElementById('username').value.trim();
      const email      = document.getElementById('email').value.trim();
      const password   = document.getElementById('password').value;
      const specialite = document.getElementById('specialite').value.trim();
      const groupe     = document.getElementById('groupe').value.trim();
      const bio        = document.getElementById('bio').value.trim();
      const msg        = document.getElementById('msg');

      if (!firstname || !lastname || !username || !email || !password) {
        msg.textContent = 'Remplis au moins : prénom, nom, username, email et mot de passe.';
        msg.className = 'msg err'; msg.style.display = 'block'; return;
      }

      const matieres = document.getElementById('matieres').value
        .split(',').map(m => m.trim()).filter(Boolean);
      const profile = {
        firstname, lastname, username, email, matieres,
        specialite, groupe, bio,
        role: selectedRole,
        avatar: selectedAvatar,
        createdAt: new Date().toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })
      };

      const res = await AuthAPI.register(username, email, password, selectedRole);
      if (res.success) {
        profile.id = res.id;
        localStorage.setItem('unitasks_user', JSON.stringify(profile));
        localStorage.setItem('unitasks_profile_' + username, JSON.stringify(profile));
        msg.textContent = '✅ Compte créé ! Redirection...';
        msg.className = 'msg ok'; msg.style.display = 'block';
        setTimeout(() => window.location.href = 'index.html', 1200);
      } else {
        msg.textContent = res.error || 'Erreur inscription.';
        msg.className = 'msg err'; msg.style.display = 'block';
      }
    }
  </script>
</body>
</html>
